    </style>

  </head>
  <body style="background-color: black;">
      <div id="navbar" class="navbar nav " style="z-index: 1;">
  
    <a class="nav-link  " href="../index.html">
      <img src="../asset/img/logo(p.p).jpg" alt="logo" height="60" style="margin: 0px 5px 5px 5px; ">
    </a>
    <div class="nav-items nav" >
        <p class="nav-item">
          <a class="nav-link "  href="../index.html" >Start</a>
        </p>
        <p class="nav-item">
          <a class="nav-link" href="../Pages/about.html">About</a>
        </p>
        <p class="nav-item">
          <a class="nav-link" href="../Pages/projects.html" 
          style=" --strike: 1; 
          background-position-x: center;">Projects</a>
        </p>
        <p class="nav-item"  >
          <a class="nav-link " href="../Pages/contact.html">Contact</a>
        </p>
    </div>
</div>
      <div id="header" ></div>
      <div class="project-part">
        <div class="containerbackground3D" >3D DESIGNS</div>
        <div class="designs">
          <p class="designs-text">3D DESIGNS</p>
        </div>
      </div>
      <main>
        <section id="projects">
          <div class="masonry-grid"></div>
        </section>
      </main>
      <script src="../projectFiles.js"></script>
      <script>
        

        document.addEventListener("DOMContentLoaded", function () {
          AOS.init({
            duration: 800, // Animation duration in milliseconds
            easing: "ease-in-out", // Animation easing
            once: false, // Animation happens every time it scrolls into view
          });
        });
        const params = new URLSearchParams(window.location.search);
        const type = params.get("type") || "logo";

        // 2. Update the heading text
        document.querySelector("title").textContent = type + " Projects";
        document.querySelector(".containerbackground3D").textContent =
          type.toUpperCase();
        document.querySelector(".designs-text").textContent =
          type.toUpperCase();

        const grid = document.querySelector(".masonry-grid");
        grid.innerHTML = "";

        projectData[type]?.forEach((project) => {
          const card = document.createElement("div");
          card.className = "project-card";
          card.innerHTML = `
    <img src="${project.img}" alt="${project.desc}" />
    <p>${project.desc}</p>
  `;
          grid.appendChild(card);
        });
      </script>

      <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  </body>
</html>
