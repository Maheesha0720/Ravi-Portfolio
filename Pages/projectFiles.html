<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title >Document</title>
    <link rel="stylesheet" href=".././asset/css/projectfiles.css" />
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap");
    </style>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Dorsa&display=swap");
    </style>
    <link rel="stylesheet" href="../asset/css/about.css" />
    <link rel="stylesheet" href="../asset/css/navbar.css" />
  </head>
  <body>
    <body>
      <div id="header"></div>
      <div class="project-part">
        <div class="containerbackground3D">3D DESIGNS</div>
        <div class="designs">
          <p class="designs-text">3D DESIGNS</p>
        </div>
      </div>
      <main>
        <section id="projects">
          <div class="masonry-grid"></div>
        </section>
      </main>
      <script src="../projectFiles.js"></script>
      <script>
        // Load header
        fetch("./components/header.html")
          .then((res) => res.text())
          .then((data) => {
            document.getElementById("header").innerHTML = data;
          });

        document.addEventListener("DOMContentLoaded", function () {
          AOS.init({
            duration: 800, // Animation duration in milliseconds
            easing: "ease-in-out", // Animation easing
            once: false, // Animation happens every time it scrolls into view
          });
        });
        const params = new URLSearchParams(window.location.search);
        const type = params.get("type") || "logo";

        // 2. Update the heading text
        document.querySelector("title").textContent = type + " Projects";
        document.querySelector(".containerbackground3D").textContent =
          type.toUpperCase();
        document.querySelector(".designs-text").textContent =
          type.toUpperCase();

        const grid = document.querySelector(".masonry-grid");
        grid.innerHTML = "";

        projectData[type]?.forEach((project) => {
          const card = document.createElement("div");
          card.className = "project-card";
          card.innerHTML = `
    <img src="${project.img}" alt="${project.desc}" />
    <p>${project.desc}</p>
  `;
          grid.appendChild(card);
        });
      </script>

      <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    </body>
  </body>
</html>
